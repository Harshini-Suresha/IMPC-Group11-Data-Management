name: R checks

on:
  push:
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dashboard dependencies
        run: Rscript -e 'install.packages(c("shiny", "bslib", "plotly", "DT", "data.table", "DBI", "testthat"), repos = getOption("repos"), quiet = TRUE)'

      - name: Parse R sources
        run: |
          Rscript -e 'files <- c(list.files("R", pattern = "[.]R$", full.names = TRUE), list.files("shiny/R", pattern = "[.]R$", full.names = TRUE), "shiny/app.R"); invisible(lapply(files, parse)); cat("Parsed", length(files), "R files\n")'

      - name: Run dashboard smoke tests
        run: Rscript tests/testthat.R
